<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#0A1B33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#C9973E"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- subtle inner ring -->
  <circle cx="256" cy="268" r="150" fill="none" stroke="#1C3A5E" stroke-width="2"/>

  <!-- dashboard gauge arc -->
  <path d="M 141 328 A 150 150 0 1 1 371 328"
        fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>

  <!-- tick marks -->
  <g stroke="#E9C46A" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="141" y1="328" x2="160" y2="316"/>
    <line x1="181" y1="196" x2="196" y2="211"/>
    <line x1="256" y1="150" x2="256" y2="172"/>
    <line x1="331" y1="196" x2="316" y2="211"/>
    <line x1="371" y1="328" x2="352" y2="316"/>
  </g>

  <!-- needle -->
  <g>
    <line x1="256" y1="278" x2="322" y2="222" stroke="#F5F0E6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="278" r="18" fill="#F5F0E6"/>
    <circle cx="256" cy="278" r="8" fill="#0A1B33"/>
  </g>

  <!-- base label bar (evokes "direzione" / institutional monogram) -->
  <rect x="176" y="392" width="160" height="10" rx="5" fill="url(#gold)" opacity="0.9"/>
  <text x="256" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#F5F0E6" letter-spacing="2">DG</text>
</svg>
